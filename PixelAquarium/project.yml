  PixelAquariumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PixelAquarium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aghamatlab.pixelaquarium.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PixelAquarium.app/PixelAquarium
        BUNDLE_LOADER: $(TEST_HOST)
  PixelAquariumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PixelAquarium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aghamatlab.pixelaquarium.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PixelAquarium
schemes:
  PixelAquarium:
    build:
      targets:
        PixelAquarium: all
        AquariumWidgetExtension: all
    test:
      targets:
        - PixelAquariumTests
        - name: PixelAquariumUITests
          skipped: true
  HomeScreenWidget:
    build:
      targets:
        PixelAquarium: all
        AquariumWidgetExtension: all
        PixelAquariumUITests: [test]
    test:
      targets:
        - PixelAquariumUITests
