name: PixelAquarium
options:
  bundleIdPrefix: com.aghamatlab
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 3NFUYR892M
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PixelAquarium:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - path: Assets/Scenes/CozyRoom
        buildPhase: resources
      - path: Assets/Scenes/MidnightManor
        buildPhase: resources
      - path: WidgetExtension/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aghamatlab.pixelaquarium
        CODE_SIGN_ENTITLEMENTS: config/PixelAquarium.entitlements
        INFOPLIST_FILE: config/App-Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: config/App-Info.plist
      properties:
        CFBundleDisplayName: Pixel Aquarium
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryAddUsageDescription: Saves the generated wallpaper so you can set it as your Home Screen background.
